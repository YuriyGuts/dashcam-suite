<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashcam Trips</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/inter/inter.css">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="is-loading">
  <aside id="sidebar">
    <header class="sidebar-header">
      <h1>Dashcam Trips</h1>
      <span id="library-summary" class="muted"></span>
    </header>

    <section id="map-controls" class="toolbar">
      <div class="segmented" role="group" aria-label="Map mode">
        <button type="button" data-mode="routes">Routes</button>
        <button type="button" data-mode="coverage">Coverage</button>
      </div>
      <div class="segmented" role="group" aria-label="Route color" id="color-controls">
        <button type="button" data-color="trip">By trip</button>
        <button type="button" data-color="speed">By speed</button>
      </div>
      <label class="switch-label" id="heat-control" hidden>
        <input type="checkbox" class="switch" id="heat-toggle">
        Heatmap
      </label>
    </section>

    <div id="trip-browser">
      <section id="filters" class="section">
        <label class="search-field">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          <input type="search" id="filter-query" list="street-names" placeholder="Search names, streets, places" autocomplete="off" aria-label="Search trip names, streets, and places" title="Separate several terms with commas to find trips that match all of them">
          <datalist id="street-names"></datalist>
        </label>
        <div id="date-filter">
          <div id="date-slider" class="range-slider" hidden>
            <div class="range-track">
              <div class="range-ticks"></div>
              <div class="range-fill"></div>
            </div>
            <input type="range" id="date-slider-from" aria-label="Earliest trip date">
            <input type="range" id="date-slider-to" aria-label="Latest trip date">
          </div>
          <div class="date-fields">
            <input type="text" id="filter-from" class="date-input" inputmode="numeric" maxlength="10" placeholder="yyyy-mm-dd" autocomplete="off" spellcheck="false" aria-label="From date (yyyy-mm-dd)">
            <span class="date-separator" aria-hidden="true"></span>
            <input type="text" id="filter-to" class="date-input" inputmode="numeric" maxlength="10" placeholder="yyyy-mm-dd" autocomplete="off" spellcheck="false" aria-label="To date (yyyy-mm-dd)">
          </div>
          <div class="chips" id="date-presets" role="group" aria-label="Date presets">
            <button type="button" class="chip" data-preset="week">Past week</button>
            <button type="button" class="chip" data-preset="month">Past month</button>
            <button type="button" class="chip" data-preset="year">Past year</button>
            <button type="button" class="chip" data-preset="all">All</button>
          </div>
        </div>
      </section>

      <section id="summary" class="section" aria-live="polite">
        <div class="summary-title">Loading trips...</div>
      </section>

      <div class="list-header">
        <span class="list-title">Trips</span>
        <div class="list-actions">
          <button type="button" class="link-button" id="select-all">Select all</button>
          <button type="button" class="link-button" id="select-none">Clear</button>
          <button type="button" class="icon-button" id="zoom-selection" title="Zoom to selection" aria-label="Zoom to selection">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
          </button>
        </div>
      </div>
      <ul id="trip-list">
        <li class="trip trip-skeleton" aria-hidden="true"><span></span><span></span></li>
        <li class="trip trip-skeleton" aria-hidden="true"><span></span><span></span></li>
        <li class="trip trip-skeleton" aria-hidden="true"><span></span><span></span></li>
        <li class="trip trip-skeleton" aria-hidden="true"><span></span><span></span></li>
        <li class="trip trip-skeleton" aria-hidden="true"><span></span><span></span></li>
        <li class="trip trip-skeleton" aria-hidden="true"><span></span><span></span></li>
      </ul>
      <details id="no-gps-trips" hidden>
        <summary></summary>
        <ul></ul>
      </details>
    </div>

    <section id="trip-detail" hidden></section>
  </aside>

  <main id="map-area">
    <div id="map"></div>
    <div id="map-status" role="status" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <span id="map-status-text">Loading trips...</span>
    </div>
    <section id="video-panel" hidden aria-label="Trip video">
      <header class="video-header" title="Drag to move">
        <svg class="icon icon-small drag-handle" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5h.01M15 5h.01M9 12h.01M15 12h.01M9 19h.01M15 19h.01"/></svg>
        <span id="video-title"></span>
        <div class="segmented segmented-small" id="video-source" role="group" aria-label="Video source">
          <button type="button" data-source="preview">Preview</button>
          <button type="button" data-source="original">Original</button>
        </div>
        <button type="button" class="icon-button" id="video-close" aria-label="Close video" title="Close (Esc)">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </header>
      <div id="video-container"></div>
      <div id="video-message" hidden></div>
    </section>
  </main>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/leaflet-heat/leaflet-heat.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
