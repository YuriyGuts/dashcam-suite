[project]
name = "dashcam-suite"
version = "0.1.0"
description = "Dashcam video toolkit: merge SD card segments, extract GPS tracks from the overlay, and visualize routes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yuriy Guts" }]
keywords = ["dashcam", "gps", "ocr", "openstreetmap", "ffmpeg", "viofo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: GIS",
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
    "osmium>=4.3.1",
    "platformdirs>=4",
    "rich>=15.0.0",
    "truststore>=0.10",
    "tzdata>=2025.2 ; sys_platform == 'win32'",
]

[project.scripts]
dashcam = "dashcam.cli:main"

[project.urls]
Homepage = "https://github.com/YuriyGuts/dashcam-suite"
Issues = "https://github.com/YuriyGuts/dashcam-suite/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "ty==0.0.84",
]

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dashcam"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.pytest.ini_options]
testpaths = ["tests"]
